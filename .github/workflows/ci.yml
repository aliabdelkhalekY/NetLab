name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Test
        run: |
          SCHEME=$(xcodebuild -list -json | python3 -c 'import json,sys; s=json.load(sys.stdin)["workspace"]["schemes"]; print("NetLab-Package" if "NetLab-Package" in s else "NetLab")')
          xcodebuild test -scheme "$SCHEME" -destination 'platform=iOS Simulator,name=iPhone 15'
